server:
  port: 8081

spring:
  application:
    name: bp-ms-customer

  datasource:
    url: jdbc:postgresql://localhost:5432/bp_banking_db?currentSchema=customer_service
    username: banking
    password: banking
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: customer_service
    open-in-view: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

app:
  jwt:
    secret: ${JWT_SECRET:BankingMicroservicesSecretKey2026DevsuJWTSign!}
    expiration-hours: ${JWT_EXPIRATION_HOURS:8}
  messaging:
    customer-events:
      exchange: ${CUSTOMER_EVENTS_EXCHANGE:customer.events}
      routing-key: ${CUSTOMER_EVENTS_ROUTING_KEY:customer.events}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.banking.customer: INFO
    com.banking.customer.application: DEBUG
    org.springframework.amqp: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
