spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: PUBLIC
    open-in-view: false

  rabbitmq:
    listener:
      simple:
        auto-startup: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

app:
  jwt:
    secret: TestSecretKeyForUnitTests2026DevsuJWTSign!!
    expiration-hours: 1
  messaging:
    enabled: false
    customer-events:
      exchange: test.customer.events
      routing-key: test.customer.events
