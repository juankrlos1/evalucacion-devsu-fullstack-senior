services:
  app-db:
    image: postgres:16-alpine
    container_name: bp-banking-db
    environment:
      POSTGRES_DB: bp_banking_db
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking
    ports:
      - "5432:5432"
    volumes:
      - app-db-data:/var/lib/postgresql/data
      - ./BaseDatos.sql:/docker-entrypoint-initdb.d/BaseDatos.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking -d bp_banking_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bp-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bp-ms-customer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: bp-ms-customer
    container_name: bp-ms-customer
    depends_on:
      app-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://app-db:5432/bp_banking_db?currentSchema=customer_service
      SPRING_DATASOURCE_USERNAME: banking
      SPRING_DATASOURCE_PASSWORD: banking
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      CUSTOMER_EVENTS_EXCHANGE: customer.events
      CUSTOMER_EVENTS_ROUTING_KEY: customer.events
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  bp-ms-account:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: bp-ms-account
    container_name: bp-ms-account
    depends_on:
      app-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      bp-ms-customer:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://app-db:5432/bp_banking_db?currentSchema=account_service
      SPRING_DATASOURCE_USERNAME: banking
      SPRING_DATASOURCE_PASSWORD: banking
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      CUSTOMER_EVENTS_EXCHANGE: customer.events
      CUSTOMER_EVENTS_QUEUE: account.customer.events
      CUSTOMER_EVENTS_ROUTING_KEY: customer.events
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ===== API Gateway (single entry point for frontend) =====
  bp-ms-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: bp-ms-gateway
    container_name: bp-ms-gateway
    depends_on:
      bp-ms-customer:
        condition: service_healthy
      bp-ms-account:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  app-db-data:
